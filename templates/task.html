{% extends 'base.html'%}

{% block content %}
    <h1>Task Page</h1>
    <form action="" method="POST" class="task-form">
        {% csrf_token %}
        {{form.title}}
        {{form.description}}
        {{form.category}}
        {{form.priority}}
        {{form.status}}
        {{form.due_date}}
        <button class="task-btn" type="submit">Add Task</button>
    </form>
{% endblock %}
