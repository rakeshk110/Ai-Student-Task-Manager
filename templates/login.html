{% extends 'base.html' %}

{% block title %}Login | AI Student Task Manager{% endblock %}

{% block content %}
<div class="auth-page">
    <h2 class="page-title">Welcome back</h2>
    <p class="page-subtitle">Sign in to manage your tasks</p>
    <div class="auth-card">
        <form action="" class="form" method="POST">
            {% csrf_token %}
            <input class="input" placeholder="Username" type="text" name="username" required autocomplete="username">
            <input class="input" placeholder="Password" type="password" name="password" required autocomplete="current-password">
            <button class="btn btn--primary btn--block" type="submit">Login</button>
            <span class="form-divider">or</span>
            <a class="form-link" href="{% url 'register' %}">Create an account</a>
        </form>
    </div>
</div>
{% endblock %}
